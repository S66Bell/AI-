<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Mira</title>
  <meta name="theme-color" content="#05080f" />
  <meta name="description" content="Your own Mira — a private AI assistant, on your phone." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mira" />
  <!-- Display fonts for a near-future feel; degrade to system fonts offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="threads-btn" class="icon-btn" aria-label="会話一覧">☰</button>
      <div class="brand">
        <img class="brand-icon" src="/static/icon.svg" alt="" />
        <div class="brand-text">
          <span class="brand-name" id="assistant-name">Mira</span>
          <span class="brand-sub" id="backend-info">connecting…</span>
        </div>
      </div>
    </div>
    <button id="menu-btn" class="icon-btn" aria-label="Menu">⋮</button>
  </header>

  <main id="messages" class="messages" aria-live="polite"></main>

  <form id="composer" class="composer" autocomplete="off">
    <button id="mic" class="mic-btn hidden" type="button" aria-label="音声入力">🎤</button>
    <textarea id="input" class="input" rows="1" placeholder="Message Mira…"
      enterkeyhint="send"></textarea>
    <button id="send" class="send-btn" type="submit" aria-label="Send">↑</button>
  </form>

  <!-- Conversation threads drawer -->
  <div id="threads-overlay" class="drawer-overlay hidden">
    <aside class="drawer" role="dialog" aria-label="会話一覧">
      <div class="drawer-head">
        <span>会話</span>
        <button id="threads-close" class="icon-btn" aria-label="閉じる">✕</button>
      </div>
      <button id="thread-new" class="btn btn-primary drawer-new">＋ 新しい会話</button>
      <input id="thread-search" class="text-input drawer-search" type="search"
        placeholder="会話を検索…" />
      <div id="thread-list" class="thread-list"></div>
    </aside>
  </div>

  <!-- Slide-down menu -->
  <div id="menu" class="menu hidden" role="menu">
    <button class="menu-item" data-action="speak" role="menuitem">音声読み上げ: オフ</button>
    <button class="menu-item" data-action="reset" role="menuitem">Reset conversation</button>
    <button class="menu-item" data-action="memory" role="menuitem">Show memory</button>
    <button class="menu-item" data-action="thinking" role="menuitem">Toggle reasoning</button>
    <button class="menu-item" data-action="clear-history" role="menuitem">Clear history</button>
    <button class="menu-item" data-action="notifications" role="menuitem">通知をオンにする</button>
    <button class="menu-item" data-action="settings" role="menuitem">Settings</button>
  </div>

  <!-- Confirmation dialog for destructive actions -->
  <div id="confirm-overlay" class="overlay hidden">
    <div class="dialog">
      <h3>Confirm action</h3>
      <pre id="confirm-text" class="confirm-text"></pre>
      <div class="dialog-actions">
        <button id="confirm-deny" class="btn btn-ghost">Decline</button>
        <button id="confirm-approve" class="btn btn-primary">Proceed</button>
      </div>
    </div>
  </div>

  <!-- Settings dialog -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="dialog">
      <h3>Settings</h3>
      <label class="field">
        <span>Access token</span>
        <input id="token-input" class="text-input" type="password"
          placeholder="Only if the server has JARVIS_WEB_TOKEN set" />
      </label>
      <p class="hint">Stored only on this device. Required when your Mira server
        is protected with a token.</p>
      <div class="dialog-actions">
        <button id="settings-close" class="btn btn-ghost">Cancel</button>
        <button id="settings-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
