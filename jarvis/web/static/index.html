<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1222" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MIRA</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{
  --bg:#f3f5fb;--bg2:#eef1fa;--text:#17213a;--muted:#6b7590;--line:rgba(23,33,58,.08);
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.82);--glass-border:rgba(255,255,255,.75);
  --a1:#5b8cff;--a2:#8a6cff;--a3:#ff6fb5;--a4:#2fd3ff;
  --user1:#4f86ff;--user2:#7a63ff;
  --ok:#36c98f;--warn:#ffb84d;--err:#ff5f6d;
  --shadow:0 10px 30px rgba(43,61,120,.10);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1222;--bg2:#121733;--text:#eaeefb;--muted:#97a0bd;--line:rgba(255,255,255,.08);
    --glass:rgba(24,30,56,.55);--glass-strong:rgba(24,30,56,.8);--glass-border:rgba(255,255,255,.12);
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden;position:relative}
/* aurora background */
body::before,body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(60px);opacity:.75}
body::before{background:
  radial-gradient(38% 30% at 18% 12%, rgba(91,140,255,.45), transparent 70%),
  radial-gradient(34% 28% at 85% 18%, rgba(255,111,181,.35), transparent 70%),
  radial-gradient(40% 32% at 70% 92%, rgba(47,211,255,.35), transparent 70%),
  radial-gradient(30% 26% at 12% 86%, rgba(138,108,255,.35), transparent 70%)}
body::after{background:radial-gradient(40% 40% at 50% 50%, rgba(255,255,255,.35), transparent 70%);animation:drift 18s ease-in-out infinite alternate}
@media (prefers-color-scheme: dark){ body::after{background:radial-gradient(40% 40% at 50% 50%, rgba(138,108,255,.18), transparent 70%)} }
@keyframes drift{from{transform:translate(-4%,-2%) scale(1)}to{transform:translate(4%,3%) scale(1.08)}}
/* header */
header{padding:calc(10px + var(--sat)) 18px 10px;display:flex;align-items:center;gap:12px}
header .name{font-weight:700;letter-spacing:.14em;font-size:15px;background:linear-gradient(90deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
header .model{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
/* the orb: idle = slow breathing, busy = fast swirl, err = red */
.orb{width:30px;height:30px;border-radius:50%;position:relative;flex:none;
  background:conic-gradient(from 0deg,var(--a1),var(--a4),var(--a2),var(--a3),var(--a1));
  box-shadow:0 0 18px rgba(91,140,255,.45),0 0 40px rgba(138,108,255,.25);
  animation:spin 9s linear infinite, breathe 3.2s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.35) 40%,rgba(255,255,255,0) 70%);mix-blend-mode:screen}
.orb.busy{animation:spin 1.4s linear infinite, breathe 1.1s ease-in-out infinite;box-shadow:0 0 24px rgba(91,140,255,.7),0 0 60px rgba(255,111,181,.4)}
.orb.err{background:conic-gradient(from 0deg,#ff5f6d,#ff9a7a,#ff5f6d);box-shadow:0 0 18px rgba(255,95,109,.5);animation:none}
.orb.ok{}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{filter:saturate(1) brightness(1)}50%{filter:saturate(1.3) brightness(1.12)}}
/* segmented tabs */
nav{margin:0 14px 8px;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;box-shadow:var(--shadow)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px;font-size:14px;font-weight:600;border-radius:10px;transition:all .2s}
nav button.active{color:var(--text);background:var(--glass-strong);box-shadow:0 2px 8px rgba(43,61,120,.12)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 12px}
/* chat */
.msg{max-width:86%;margin:8px 0;padding:11px 15px;border-radius:20px;white-space:pre-wrap;word-break:break-word;line-height:1.55;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.msg.user{margin-left:auto;color:#fff;background:linear-gradient(135deg,var(--user1),var(--user2));border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(93,112,255,.28)}
.msg.bot{margin-right:auto;background:var(--glass-strong);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.bot .md pre{background:rgba(23,33,58,.06);padding:10px;border-radius:12px;overflow-x:auto;font-size:13px;white-space:pre}
.msg.bot .md code{background:rgba(23,33,58,.07);padding:1px 5px;border-radius:6px;font-size:13px}
@media (prefers-color-scheme: dark){ .msg.bot .md pre,.msg.bot .md code{background:rgba(255,255,255,.08)} }
.msg.bot .md ul{margin:4px 0;padding-left:20px}
.msg.bot .md a{color:var(--a1)}
.msg .thinking{color:var(--muted);font-style:italic;font-size:13px}
.fb{display:flex;gap:6px;margin:-2px 0 8px 12px}
.fb button{border:1px solid var(--glass-border);background:var(--glass);border-radius:999px;font-size:13px;padding:2px 10px;color:var(--muted)}
.fb button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.status{color:var(--muted);font-size:12px;margin:4px 0 4px 10px;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a3));flex:none}
.status.wait::before{width:10px;height:10px;animation:spin 1.2s linear infinite, breathe 1s ease-in-out infinite;background:conic-gradient(from 0deg,var(--a1),var(--a4),var(--a2),var(--a3),var(--a1))}
.errline{color:var(--err);font-size:13px;margin:4px 10px}
.note{margin:10px auto;max-width:92%;padding:10px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;color:var(--muted);text-align:center;white-space:pre-wrap;word-break:break-word}
.note b{color:var(--text);display:block;margin-bottom:2px}
/* composer */
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(10px + var(--sab))}
textarea{flex:1;resize:none;border:1px solid var(--glass-border);border-radius:22px;background:var(--glass-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--text);padding:11px 16px;font:inherit;max-height:140px;min-height:44px;box-shadow:var(--shadow);outline:none}
textarea:focus{border-color:rgba(91,140,255,.55);box-shadow:0 0 0 4px rgba(91,140,255,.15),var(--shadow)}
textarea::placeholder{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 16px rgba(93,112,255,.3);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.sec{background:var(--glass-strong);color:var(--text);border:1px solid var(--glass-border);box-shadow:var(--shadow)}
.btn.icon{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:50%}
.btn:disabled{opacity:.5}
.btn.stop{background:linear-gradient(135deg,var(--a3),#ff8f6b)}
.btn.rec{background:linear-gradient(135deg,var(--a3),#ff8f6b);color:#fff;animation:breathe 1s ease-in-out infinite}
/* cards / forms */
.card{background:var(--glass-strong);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow);animation:pop .22s ease-out}
.card .title{font-weight:600;word-break:break-word}
.card .meta{font-size:12px;color:var(--muted);margin-top:3px}
.card .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card .actions .btn{padding:7px 12px;font-size:13px;border-radius:12px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(23,33,58,.08);color:var(--text);margin-right:8px;vertical-align:middle}
.badge.running{background:linear-gradient(135deg,#ffd37a,#ffb84d);color:#3a2600}
.badge.done{background:linear-gradient(135deg,#5fe3b2,#36c98f);color:#073b27}
.badge.queued{background:linear-gradient(135deg,#8fc1ff,#5b8cff);color:#fff}
.badge.failed,.badge.cancelled{background:linear-gradient(135deg,#ff7d88,#ff5f6d);color:#fff}
.form{padding:10px 14px calc(12px + var(--sab));background:var(--glass);border-top:1px solid var(--glass-border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.form .row{display:flex;gap:8px;margin-top:8px;align-items:center}
.form input,.form select{flex:1;border:1px solid var(--glass-border);border-radius:14px;background:var(--glass-strong);color:var(--text);padding:9px 12px;font:inherit;min-width:0;outline:none}
.form input:focus,.form select:focus{border-color:rgba(91,140,255,.55);box-shadow:0 0 0 4px rgba(91,140,255,.15)}
.form textarea{width:100%;max-height:120px;border-radius:16px}
.result{background:rgba(23,33,58,.05);border-radius:12px;padding:10px;margin-top:10px;white-space:pre-wrap;word-break:break-word;font-size:14px}
@media (prefers-color-scheme: dark){ .result{background:rgba(255,255,255,.06)} }
.log{font-size:12px;color:var(--muted);margin-top:8px;max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .text{color:var(--text)} .log .status::before,.log .error::before{content:"· "} .log .error{color:var(--err)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.empty .orb{margin:0 auto 14px;width:56px;height:56px;animation-duration:12s,4s}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(14,18,34,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.modal .box{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:22px;padding:18px;max-width:460px;width:100%;box-shadow:var(--shadow);animation:pop .2s ease-out}
.modal .box > div:first-child{font-weight:700;color:var(--warn)}
.modal pre{white-space:pre-wrap;word-break:break-word;background:rgba(23,33,58,.06);padding:10px;border-radius:12px;font-size:13px}
@media (prefers-color-scheme: dark){ .modal pre{background:rgba(255,255,255,.08)} }
.toggle{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.toggle input{accent-color:var(--a1)}
/* desktop / tablet: keep a comfortable column instead of stretching edge to edge */
@media (min-width: 900px){
  header,nav,.scroll,.composer,.form{max-width:900px;margin-left:auto;margin-right:auto;width:100%}
  nav{margin:0 auto 10px}
  .msg{max-width:78%}
  body{font-size:16px}
  .hint{font-size:13px}
}
@media (min-width: 1400px){
  header,nav,.scroll,.composer,.form{max-width:1040px}
}
</style>
</head>
<body>
<header>
  <span class="orb" id="dot" aria-hidden="true"></span>
  <span class="name">MIRA</span>
  <span class="model" id="model">connecting…</span>
</header>
<nav>
  <button data-view="chat" class="active">チャット</button>
  <button data-view="tasks">タスク</button>
  <button data-view="schedules">定期実行</button>
  <button data-view="memory">記憶</button>
</nav>
<main>
  <!-- chat -->
  <section class="view active" id="view-chat">
    <div class="scroll" id="chat"><div class="empty"><div class="orb"></div>なんでも話しかけてね</div></div>
    <div class="composer">
      <button class="btn icon sec" id="mic" title="音声入力">🎤</button>
      <textarea id="input" rows="1" placeholder="メッセージ" enterkeyhint="send"></textarea>
      <button class="btn icon" id="send" title="送信">➤</button>
      <button class="btn icon stop" id="stop" title="止める" style="display:none">■</button>
    </div>
  </section>
  <!-- tasks -->
  <section class="view" id="view-tasks">
    <div class="scroll" id="tasks"><div class="empty"><div class="orb"></div>タスクはまだありません</div></div>
    <div class="form">
      <textarea id="taskGoal" rows="2" placeholder="MIRAに任せる仕事(例: 今週のAI関連ニュースを3つ調べて要約して)"></textarea>
      <div class="row"><button class="btn" id="taskStart">バックグラウンドで実行</button></div>
      <p class="hint">MIRAが自分でツールを使って最後まで進めて、結果を報告するよ。</p>
    </div>
  </section>
  <!-- schedules -->
  <section class="view" id="view-schedules">
    <div class="scroll" id="schedules"><div class="empty">定期タスクはありません</div></div>
    <div class="form">
      <textarea id="schedGoal" rows="2" placeholder="定期的にやってほしいこと"></textarea>
      <div class="row">
        <select id="schedKind"><option value="daily">毎日 指定時刻</option><option value="every">N分ごと</option></select>
        <input id="schedTime" type="time" value="08:00">
        <input id="schedEvery" type="number" min="1" value="60" style="display:none" placeholder="分">
        <button class="btn" id="schedAdd">追加</button>
      </div>
      <p class="hint">MIRAが起動している間だけ動くよ。寝ていた間の分は起動後に1回まとめて実行。</p>
    </div>
  </section>
  <!-- memory -->
  <section class="view" id="view-memory">
    <div class="scroll" id="memory"><div class="empty">まだ何も覚えていません</div></div>
    <div class="form">
      <div class="row"><input id="factInput" placeholder="覚えておいてほしいこと"><button class="btn" id="factAdd">記憶</button></div>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="tts"> 返事を読み上げる</label>
        <span style="flex:1"></span>
        <button class="btn sec" id="learnNow">今の会話から学習</button>
        <button class="btn sec" id="resetCtx">会話をリセット</button>
        <button class="btn sec" id="clearHist">履歴を全部消す</button>
        <button class="btn sec" id="logout">この端末のトークンを消す</button>
      </div>
    </div>
  </section>
</main>
<div class="modal" id="confirmModal">
  <div class="box">
    <div style="font-weight:600;color:var(--warn)">確認が必要です</div>
    <pre id="confirmText"></pre>
    <div class="card actions" style="display:flex;gap:8px;justify-content:flex-end;background:none;border:0;padding:0">
      <button class="btn sec" id="confirmNo">やめる</button>
      <button class="btn" id="confirmYes">実行する</button>
    </div>
  </div>
</div>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token = localStorage.getItem('jarvis_token') || '';
const headers = () => token ? {'Authorization': 'Bearer ' + token} : {};
async function api(path, opts = {}) {
  const o = Object.assign({headers: Object.assign({'Content-Type': 'application/json'}, headers())}, opts);
  if (o.body && typeof o.body !== 'string') o.body = JSON.stringify(o.body);
  const r = await fetch(path, o);
  if (r.status === 401) { askToken(); throw new Error('token required'); }
  if (r.status === 403) { alert('このネットワークからの接続は許可されていません(JARVIS_WEB_ALLOW)'); throw new Error('forbidden'); }
  if (r.status === 429) { alert('トークンの間違いが続いたので、しばらくロックされています'); throw new Error('locked'); }
  return r.json();
}
function askToken() {
  const t = prompt('アクセストークンを入力してね (JARVIS_WEB_TOKEN)');
  if (t) { token = t.trim(); localStorage.setItem('jarvis_token', token); location.reload(); }
}
// ── markdown-lite ─────────────────────────────────────────────
function md(src) {
  const blocks = []; let s = String(src);
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => { blocks.push('<pre>' + esc(c) + '</pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
  s = s.replace(/(^|\n)((?:[-*] .*(?:\n|$))+)/g, (_, p, list) => p + '<ul>' + list.trim().split('\n').map(l => '<li>' + l.replace(/^[-*] /, '') + '</li>').join('') + '</ul>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
  return s;
}
// ── tabs ─────────────────────────────────────────────────────
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + b.dataset.view));
  ({tasks: loadTasks, schedules: loadSchedules, memory: loadMemory}[b.dataset.view] || (() => {}))();
});
// ── state ────────────────────────────────────────────────────
async function loadState() {
  try {
    const s = await api('/api/state');
    const short = String(s.model).split('/').pop().replace(/\.gguf$/i, '');
    const label = {claude: 'Claude', groq: 'Groq'}[s.provider] || 'local';
    $('#model').textContent = label + ' · ' + short;
    $('#dot').className = 'orb ' + (s.ready ? (s.busy ? 'busy' : 'ok') : 'err');
    if (!s.ready && s.error) addError(s.error);
    document.title = s.name;
    $('header .name').textContent = s.name;
  } catch (e) { $('#dot').className = 'orb err'; }
}
// ── chat ─────────────────────────────────────────────────────
const chat = $('#chat'), input = $('#input'), send = $('#send');
const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };
function addMsg(role, text) {
  const ph = chat.querySelector('.empty'); if (ph) ph.remove();
  const d = document.createElement('div'); d.className = 'msg ' + role;
  if (role === 'bot') { d.innerHTML = '<div class="md">' + md(text) + '</div>'; } else d.textContent = text;
  chat.appendChild(d); scrollDown(); return d;
}
function addNote(text) {
  const ph = chat.querySelector('.empty'); if (ph) ph.remove();
  const m = text.match(/goal:\s*([\s\S]*?)\nResult:\n([\s\S]*)$/);
  const d = document.createElement('div'); d.className = 'note';
  if (m) { d.innerHTML = '<b>✓ バックグラウンドタスク完了: ' + esc(m[1].trim()) + '</b>' + esc(m[2].trim().slice(0, 400)); }
  else d.textContent = text.replace(/^\[System note\]\s*/, '');
  chat.appendChild(d); scrollDown();
}
function addFeedback(userText, replyText) {
  const row = document.createElement('div'); row.className = 'fb';
  const up = document.createElement('button'); up.textContent = '👍';
  const down = document.createElement('button'); down.textContent = '👎 直してほしい';
  const send = async (rating, note) => {
    up.classList.toggle('on', rating === 'up'); down.classList.toggle('on', rating === 'down');
    const r = await api('/api/feedback', {method: 'POST', body: {rating, note, user: userText, reply: replyText}});
    if (r.learning) addStatus('了解。次から気をつけるね(接し方として学習中)');
  };
  up.onclick = () => send('up', '');
  down.onclick = () => { const note = prompt('どう直してほしい?(空でもOK)') ; if (note === null) return; send('down', note); };
  row.append(up, down); chat.appendChild(row); scrollDown();
}
function addStatus(text) { const d = document.createElement('div'); d.className = 'status'; d.textContent = text; chat.appendChild(d); scrollDown(); }
function addError(text) { const d = document.createElement('div'); d.className = 'errline'; d.textContent = text; chat.appendChild(d); scrollDown(); }
async function loadHistory() {
  try {
    const h = await api('/api/history?limit=60');
    if (h.rows.length) chat.innerHTML = '';
    for (const r of h.rows) {
      if (r.role === 'user' && r.text.startsWith('[System note]')) addNote(r.text);
      else addMsg(r.role === 'user' ? 'user' : 'bot', r.text);
    }
  } catch (e) {}
}
let sending = false, aborter = null;
const stopBtn = $('#stop');
const WATCHDOG_MS = 240000; // abort if nothing arrives for 4 minutes
function setSending(on) {
  sending = on; send.disabled = on;
  send.style.display = on ? 'none' : ''; stopBtn.style.display = on ? '' : 'none';
}
stopBtn.onclick = async () => {
  try { await api('/api/chat/cancel', {method: 'POST'}); } catch (e) {}
  if (aborter) aborter.abort();
};
async function sendMessage() {
  const text = input.value.trim();
  if (!text || sending) return;
  setSending(true); input.value = ''; autoGrow();
  addMsg('user', text);
  let bot = null, buf = '', thinkEl = null;
  const ensureBot = () => { if (!bot) { bot = addMsg('bot', ''); } return bot; };
  // "thinking…" indicator with elapsed time, until the first byte arrives
  const wait = document.createElement('div'); wait.className = 'status wait'; chat.appendChild(wait); scrollDown();
  const t0 = Date.now();
  const waitTimer = setInterval(() => { wait.textContent = `考え中… ${Math.round((Date.now() - t0) / 1000)}秒`; }, 500);
  const stopWait = () => { clearInterval(waitTimer); wait.remove(); };
  aborter = new AbortController();
  let watchdog = setTimeout(() => aborter.abort('timeout'), WATCHDOG_MS);
  const kick = () => { clearTimeout(watchdog); watchdog = setTimeout(() => aborter.abort('timeout'), WATCHDOG_MS); };
  try {
    const r = await fetch('/api/chat', {method: 'POST', signal: aborter.signal, headers: Object.assign({'Content-Type': 'application/json'}, headers()), body: JSON.stringify({message: text})});
    if (r.status === 401) { askToken(); return; }
    if (r.status === 403 || r.status === 429) { addError(r.status === 403 ? 'このネットワークからは使えないよ' : 'トークンの間違いが続いたのでロック中'); return; }
    const reader = r.body.getReader(), dec = new TextDecoder(); let pending = '';
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      kick();
      pending += dec.decode(value, {stream: true});
      let i;
      while ((i = pending.indexOf('\n\n')) >= 0) {
        const raw = pending.slice(0, i); pending = pending.slice(i + 2);
        let ev = 'message', data = '';
        for (const line of raw.split('\n')) { if (line.startsWith('event:')) ev = line.slice(6).trim(); else if (line.startsWith('data:')) data += line.slice(5).trim(); }
        if (!data) continue;
        let payload; try { payload = JSON.parse(data); } catch (e) { continue; }
        if (ev === 'text' || ev === 'error' || ev === 'done') stopWait();
        if (ev === 'text') { buf += payload; ensureBot().querySelector('.md').innerHTML = md(buf); scrollDown(); }
        else if (ev === 'thinking') { if (!thinkEl) { thinkEl = document.createElement('div'); thinkEl.className = 'thinking'; ensureBot().prepend(thinkEl); } thinkEl.textContent += payload; scrollDown(); }
        else if (ev === 'status') addStatus(payload);
        else if (ev === 'confirm') showConfirm(payload);
        else if (ev === 'error') addError(payload);
        else if (ev === 'done' && !payload.reply && !buf) { addError('モデルから空の返事が返ってきた。もう一度送ってみて(続くようなら doctor.sh のログを見てね)'); }
        else if (ev === 'done') { if (payload.reply && !buf) { ensureBot().querySelector('.md').innerHTML = md(payload.reply); buf = payload.reply; } if ($('#tts').checked && buf) speak(buf); if (buf) addFeedback(text, buf); }
      }
    }
  } catch (e) {
    if (aborter.signal.aborted) { addError(aborter.signal.reason === 'timeout' ? '4分間応答がなかったので中断したよ。もう一度送ってみて。' : '止めたよ。'); try { await api('/api/chat/cancel', {method: 'POST'}); } catch (_) {} }
    else addError('通信エラー: ' + e.message);
  }
  finally { clearTimeout(watchdog); stopWait(); aborter = null; setSending(false); loadState(); }
}
send.onclick = sendMessage;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(min-width: 700px)').matches) { e.preventDefault(); sendMessage(); } });
function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', autoGrow);
// confirm modal
function showConfirm(p) {
  $('#confirmText').textContent = p.question; $('#confirmModal').classList.add('show');
  const answer = ok => { $('#confirmModal').classList.remove('show'); api('/api/confirm', {method: 'POST', body: {id: p.id, approved: ok}}); };
  $('#confirmYes').onclick = () => answer(true); $('#confirmNo').onclick = () => answer(false);
}
// voice
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('#mic');
if (!SR) mic.style.display = 'none';
else {
  let rec = null;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = navigator.language || 'ja-JP'; rec.interimResults = true;
    mic.classList.add('rec');
    rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript; input.value = t; autoGrow(); };
    rec.onend = () => { mic.classList.remove('rec'); rec = null; if (input.value.trim()) sendMessage(); };
    rec.onerror = () => { mic.classList.remove('rec'); rec = null; };
    rec.start();
  };
}
function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g, '').slice(0, 1500));
  u.lang = /[぀-ヿ一-鿿]/.test(text) ? 'ja-JP' : 'en-US';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
$('#tts').checked = localStorage.getItem('jarvis_tts') === '1';
$('#tts').onchange = e => localStorage.setItem('jarvis_tts', e.target.checked ? '1' : '0');
// ── tasks ────────────────────────────────────────────────────
const tasksEl = $('#tasks'); const openTasks = new Set();
function taskCard(t) {
  const c = document.createElement('div'); c.className = 'card'; c.dataset.id = t.id;
  c.innerHTML = `<div class="title"><span class="badge ${t.status}">${t.status}</span>${esc(t.goal)}</div>
    <div class="meta">${esc(t.created.replace('T', ' '))} · ${t.steps} steps · ${esc(t.source)}</div>
    <div class="detail"></div>
    <div class="actions">
      <button class="btn sec" data-act="open">${openTasks.has(t.id) ? '閉じる' : '詳細'}</button>
      ${['queued','running'].includes(t.status) ? '<button class="btn sec" data-act="cancel">中止</button>' : ''}
    </div>`;
  c.querySelector('[data-act=open]').onclick = () => { openTasks.has(t.id) ? openTasks.delete(t.id) : openTasks.add(t.id); loadTasks(); };
  const cancel = c.querySelector('[data-act=cancel]'); if (cancel) cancel.onclick = async () => { await api(`/api/tasks/${t.id}/cancel`, {method: 'POST'}); loadTasks(); };
  if (openTasks.has(t.id)) fillTaskDetail(c, t.id);
  return c;
}
async function fillTaskDetail(card, id) {
  const {task} = await api('/api/tasks/' + id);
  const d = card.querySelector('.detail'); let html = '';
  if (task.result) html += '<div class="result">' + md(task.result) + '</div>';
  if (task.error) html += '<div class="errline">' + esc(task.error) + '</div>';
  html += '<div class="log">' + task.log.map(e => `<div class="${e.kind}">${esc(e.text)}</div>`).join('') + '</div>';
  d.innerHTML = html;
}
async function loadTasks() {
  const {tasks} = await api('/api/tasks?limit=50');
  tasksEl.innerHTML = '';
  if (!tasks.length) { tasksEl.innerHTML = '<div class="empty"><div class="orb"></div>タスクはまだありません</div>'; return; }
  for (const t of tasks) tasksEl.appendChild(taskCard(t));
}
$('#taskStart').onclick = async () => {
  const goal = $('#taskGoal').value.trim(); if (!goal) return;
  const r = await api('/api/tasks', {method: 'POST', body: {goal}});
  if (r.error) return alert(r.error);
  $('#taskGoal').value = ''; openTasks.add(r.task.id); loadTasks();
};
// live updates
function connectEvents() {
  const es = new EventSource('/api/events' + (token ? '?token=' + encodeURIComponent(token) : ''));
  let timer = null;
  es.addEventListener('task', () => { if ($('#view-tasks').classList.contains('active')) { clearTimeout(timer); timer = setTimeout(loadTasks, 400); } });
  es.onerror = () => { es.close(); setTimeout(connectEvents, 5000); };
}
// ── schedules ────────────────────────────────────────────────
$('#schedKind').onchange = e => { const daily = e.target.value === 'daily'; $('#schedTime').style.display = daily ? '' : 'none'; $('#schedEvery').style.display = daily ? 'none' : ''; };
async function loadSchedules() {
  const {schedules} = await api('/api/schedules'); const el = $('#schedules'); el.innerHTML = '';
  if (!schedules.length) { el.innerHTML = '<div class="empty">定期タスクはありません</div>'; return; }
  for (const s of schedules) {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="title"><span class="badge ${s.enabled ? 'done' : ''}">${s.enabled ? 'on' : 'off'}</span>${esc(s.goal)}</div>
      <div class="meta">${esc(s.describe)} · 次回 ${esc((s.next_run || '-').replace('T', ' '))}${s.last_run ? ' · 前回 ' + esc(s.last_run.replace('T', ' ')) : ''}</div>
      <div class="actions"><button class="btn sec" data-act="run">今すぐ実行</button><button class="btn sec" data-act="toggle">${s.enabled ? '停止' : '再開'}</button><button class="btn sec" data-act="del">削除</button></div>`;
    c.querySelector('[data-act=run]').onclick = async () => { await api(`/api/schedules/${s.id}/run`, {method: 'POST'}); alert('タスクを開始しました'); };
    c.querySelector('[data-act=toggle]').onclick = async () => { await api(`/api/schedules/${s.id}/toggle`, {method: 'POST'}); loadSchedules(); };
    c.querySelector('[data-act=del]').onclick = async () => { if (confirm('削除しますか?')) { await api(`/api/schedules/${s.id}`, {method: 'DELETE'}); loadSchedules(); } };
    el.appendChild(c);
  }
}
$('#schedAdd').onclick = async () => {
  const goal = $('#schedGoal').value.trim(); if (!goal) return;
  const body = {goal};
  if ($('#schedKind').value === 'daily') body.daily_at = $('#schedTime').value; else body.every_minutes = parseInt($('#schedEvery').value, 10);
  const r = await api('/api/schedules', {method: 'POST', body});
  if (r.error) return alert(r.error);
  $('#schedGoal').value = ''; loadSchedules();
};
// ── memory ───────────────────────────────────────────────────
async function loadMemory() {
  const {facts, summary, lessons = [], knowledge = [], playbook = []} = await api('/api/memory'); const el = $('#memory'); el.innerHTML = '';
  if (summary) { const c = document.createElement('div'); c.className = 'card'; c.innerHTML = '<div class="meta">これまでの会話の要約</div><div class="title" style="font-weight:400;white-space:pre-wrap">' + esc(summary) + '</div>'; el.appendChild(c); }
  if (lessons.length) {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<div class="meta">学んだ接し方(👎 や訂正から自動で学習)</div>' + lessons.map(l => `<div class="title" style="font-weight:400;display:flex;gap:8px;align-items:flex-start"><span style="flex:1">・${esc(l.text)}</span><button class="btn sec" style="padding:2px 8px;font-size:12px" data-lesson="${esc(l.text)}">消す</button></div>`).join('');
    c.querySelectorAll('[data-lesson]').forEach(b => b.onclick = async () => { await api('/api/lessons/forget', {method: 'POST', body: {query: b.dataset.lesson}}); loadMemory(); });
    el.appendChild(c);
  }
  { const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="meta">覚えさせた知識(${knowledge.length} 件)・作業の教訓 ${playbook.length} 件</div>` +
      knowledge.map(k => `<div class="title" style="font-weight:400;display:flex;gap:8px;align-items:flex-start"><span style="flex:1">📚 ${esc(k.title)} <span class="meta" style="display:inline">(${k.chars} 文字)</span></span><button class="btn sec" style="padding:2px 8px;font-size:12px" data-kid="${k.id}">消す</button></div>`).join('') +
      `<div class="row" style="display:flex;gap:8px;margin-top:8px"><input id="kTitle" placeholder="タイトル(任意)" style="flex:1;border:1px solid var(--glass-border);border-radius:14px;background:var(--glass-strong);color:var(--text);padding:9px 12px;font:inherit;min-width:0"></div>
       <textarea id="kText" rows="3" placeholder="覚えさせたい文章、または https:// で始まる URL" style="width:100%;margin-top:8px;border-radius:16px"></textarea>
       <div class="row" style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="kAdd">覚えさせる</button></div>`;
    c.querySelectorAll('[data-kid]').forEach(b => b.onclick = async () => { await api('/api/knowledge/' + b.dataset.kid, {method: 'DELETE'}); loadMemory(); });
    c.querySelector('#kAdd').onclick = async () => {
      const v = c.querySelector('#kText').value.trim(); if (!v) return;
      const body = {title: c.querySelector('#kTitle').value.trim()}; if (/^https?:\/\//.test(v)) body.url = v; else body.text = v;
      c.querySelector('#kAdd').disabled = true; const r = await api('/api/knowledge', {method: 'POST', body}); c.querySelector('#kAdd').disabled = false;
      alert(r.message); loadMemory();
    };
    el.appendChild(c); }
  if (!facts.length) { el.insertAdjacentHTML('beforeend', '<div class="empty"><div class="orb"></div>まだ何も覚えていないよ。会話するうちに自動で覚えていくから、しばらく話してみて</div>'); return; }
  for (const f of facts) {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="title">${esc(f.fact)}</div><div class="meta">${esc((f.added || '').replace('T', ' '))}${f.source === 'auto' ? ' · 会話から自動で記憶' : ''}</div><div class="actions"><button class="btn sec">忘れる</button></div>`;
    c.querySelector('button').onclick = async () => { await api('/api/memory/forget', {method: 'POST', body: {query: f.fact}}); loadMemory(); };
    el.appendChild(c);
  }
}
$('#factAdd').onclick = async () => { const fact = $('#factInput').value.trim(); if (!fact) return; await api('/api/memory', {method: 'POST', body: {fact}}); $('#factInput').value = ''; loadMemory(); };
$('#learnNow').onclick = async () => { await api('/api/learn', {method: 'POST'}); alert('バックグラウンドで整理中。少ししたら「記憶」を開き直してね'); };
$('#logout').onclick = () => { localStorage.removeItem('jarvis_token'); location.reload(); };
$('#clearHist').onclick = async () => { if (confirm('保存された会話履歴をすべて消しますか?(記憶した事実は残ります)')) { await api('/api/clear-history', {method: 'POST'}); chat.innerHTML = '<div class="empty"><div class="orb"></div>なんでも話しかけてね</div>'; addStatus('履歴を消したよ'); } };
$('#resetCtx').onclick = async () => { if (confirm('会話の文脈をリセットしますか?(記憶は残ります)')) { await api('/api/reset', {method: 'POST'}); addStatus('会話をリセットしました'); } };
// ── boot ─────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
loadState(); loadHistory(); connectEvents();
setInterval(loadState, 30000);
})();
</script>
</body>
