name: Deploy to Hugging Face Space

# Deploys JARVIS to a Hugging Face Space entirely in the cloud. The only setup
# you do once: add an HF_TOKEN secret (GitHub → Settings → Secrets and
# variables → Actions). Optional: a JARVIS_WEB_TOKEN secret to gate the app,
# and HF_SPACE_NAME / JARVIS_HF_MODEL repository variables.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys racing to the same Space.
concurrency:
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: pip install "huggingface_hub>=0.24"

      - name: Deploy to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JARVIS_WEB_TOKEN: ${{ secrets.JARVIS_WEB_TOKEN }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
          JARVIS_HF_MODEL: ${{ vars.JARVIS_HF_MODEL }}
          JARVIS_LANGUAGE: ${{ vars.JARVIS_LANGUAGE }}
        run: python scripts/deploy_hf_space.py
